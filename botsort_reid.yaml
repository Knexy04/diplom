# BoT-SORT + ReID для системы детекции детей
# Аналог StrongSORT из Adult-Child-Tracker, но встроен в ultralytics

tracker_type: botsort

# Пороги ассоциации
track_high_thresh: 0.25    # Порог первого этапа
track_low_thresh: 0.1      # Порог второго этапа (low-score matches)
new_track_thresh: 0.25     # Порог создания нового трека
track_buffer: 60           # Кадров до удаления потерянного трека (2 сек при 30fps)
match_thresh: 0.8          # Порог IoU для ассоциации

fuse_score: True

# BoT-SORT специфичные
gmc_method: none           # Компенсация движения камеры (none для стационарных камер; sparseOptFlow — для PTZ/подвижных, но дорого на CPU)

# ReID — переидентификация людей после окклюзии
proximity_thresh: 0.5      # Мин. IoU для ReID
appearance_thresh: 0.8     # Мин. схожесть внешности для ReID
with_reid: False           # ReID отключён — экономия FPS на слабом сервере (ассоциация только по IoU/движению)
model: yolo26n-cls.pt      # (не используется при with_reid: False) явная .pt-модель → ReID на GPU (~27 мс/кадр); model:auto откатывается на CPU (~330 мс)
